name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Run Playwright (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browsers
        run: npx playwright install --with-deps chromium

      # External fork PRs run with a read-only token and no repository secrets,
      # so the credentials arrive empty there. The suite is skipped with an
      # explicit notice instead of a misleading failure. Secrets are never
      # exposed to PR code: both projects of this workflow are "pull_request",
      # which GitHub runs outside the trusted context, and no value is ever
      # echoed or written anywhere by this step.
      - name: Check demo credentials (skip cleanly on external fork PRs)
        id: credentials
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
        run: |
          if [ -n "$CRM_USERNAME" ] && [ -n "$CRM_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CRM demo credentials are not available in this context (external fork pull request). The authenticated Chromium suite is skipped; nothing is exposed."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests (Chromium only)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        env:
          CRM_USERNAME: ${{ secrets.CRM_USERNAME }}
          CRM_PASSWORD: ${{ secrets.CRM_PASSWORD }}
        run: npm run test:chromium

      - name: Upload Playwright reports and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
